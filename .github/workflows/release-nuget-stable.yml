name: Release NuGet Stable

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/skills/subtitle-extractslator/SKILL.md
      - packages.released.md
      - packages.released.zh-CN.md
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: 9.0.x

jobs:
  release-stable:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-release]') }}
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: 6.7.x

      - name: Determine branch metadata
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0

      - name: Test shared version resolver
        run: python -B -m unittest discover -s scripts -p "test_release_versions.py" -v

      - name: Resolve monotonic stable package version
        id: version
        shell: bash
        env:
          GITVERSION_BRANCH: ${{ steps.gitversion.outputs.branchName }}
          PRE_RELEASE_LABEL: ${{ steps.gitversion.outputs.preReleaseLabel }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ] || [ "${GITVERSION_BRANCH}" != "main" ]; then
            echo "Stable release requires main; ref=${GITHUB_REF_NAME}, GitVersion=${GITVERSION_BRANCH}." >&2
            exit 1
          fi
          if [ -n "${PRE_RELEASE_LABEL}" ]; then
            echo "Stable release resolved an unexpected prerelease label: ${PRE_RELEASE_LABEL}." >&2
            exit 1
          fi
          PACKAGE_VERSION="$(python scripts/ResolveSharedPackageVersion.py --release-set-file release-set.json --channel stable)"
          if ! printf '%s' "$PACKAGE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Shared stable package version is invalid: $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "SelectedPackageVersion=$PACKAGE_VERSION"

      - name: Validate promotable skill channel metadata
        shell: pwsh
        run: |
          $skill = Get-Content ".github/skills/subtitle-extractslator/SKILL.md" -Raw
          if ($skill -notmatch '(?m)^\s*channel:\s*(stable|beta)\s*$') {
            throw "SKILL.md metadata.channel must be stable or beta before promotion to main."
          }

      - name: Restore
        run: dotnet restore SubtitleExtractslator.sln

      - name: Build
        run: dotnet build SubtitleExtractslator.sln -c Release --no-restore

      - name: Test
        run: dotnet test SubtitleExtractslator.sln -c Release --no-build

  package-rid:
    needs: release-stable
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2025
          - rid: win-arm64
            runner: windows-11-arm
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: linux-musl-x64
            runner: ubuntu-24.04
          - rid: linux-musl-arm64
            runner: ubuntu-24.04-arm
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install NativeAOT Linux toolchain
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld zlib1g-dev
          if [[ "${{ matrix.rid }}" == linux-musl-* ]]; then
            sudo apt-get install -y musl-tools
          fi

      - name: Pack RID runtime
        shell: pwsh
        run: >-
          ./scripts/pack-rid-runtime.ps1
          -Rid '${{ matrix.rid }}'
          -PackageVersion '${{ needs.release-stable.outputs.package_version }}'
          -OutputRoot artifacts

      - name: Upload RID package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-${{ matrix.rid }}
          path: artifacts/nuget/${{ matrix.rid }}/*.nupkg
          if-no-files-found: error
          retention-days: 7

  publish-stable:
    needs: [release-stable, package-rid]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download RID packages
        uses: actions/download-artifact@v4
        with:
          pattern: nuget-*
          path: artifacts/nuget
          merge-multiple: true

      - name: Validate release set and create checksums
        shell: pwsh
        run: >-
          ./scripts/prepare-rid-release-set.ps1
          -PackageVersion '${{ needs.release-stable.outputs.package_version }}'

      - name: Push package set to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "${NUGET_API_KEY}" ]; then
            echo "NUGET_API_KEY is required; refusing to publish only a GitHub fallback release." >&2
            exit 1
          fi
          for package in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$package" --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Remove legacy fallback assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="nuget-stable-latest"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              case "$asset" in
                *.nupkg|*.nupkg.sha512|subtitle-extractslator-skill.zip)
                  gh release delete-asset "$release_tag" "$asset" --yes
                  ;;
              esac
            done < <(gh release view "$release_tag" --json assets --jq '.assets[].name')
          fi

      - name: Publish stable fallback release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nuget-stable-latest
          name: NuGet Stable Latest
          prerelease: false
          make_latest: true
          files: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.nupkg.sha512

      - name: Sync stable package and skill metadata
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.release-stable.outputs.package_version }}
        run: |
          python scripts/update_package_index_version.py --channel stable --version $env:PACKAGE_VERSION
          $skillPath = ".github/skills/subtitle-extractslator/SKILL.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packages.released.md packages.released.zh-CN.md $skillPath
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "chore(release): sync stable package version $env:PACKAGE_VERSION [skip-release]"
            git push origin HEAD:main
          } elseif ($LASTEXITCODE -ne 0) {
            throw "Could not inspect staged release metadata."
          }