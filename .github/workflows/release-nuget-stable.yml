name: Release NuGet Stable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: 9.0.x
  PACKAGE_ID: SubtitleExtractslator.Cli
  PROJECT_PATH: SubtitleExtractslator.Cli/SubtitleExtractslator.Cli.csproj

jobs:
  release-stable:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: 6.2.x

      - name: Determine version
        id: gitversion
        shell: bash
        run: |
          set -euo pipefail
          gitversion_output="$(mktemp "${RUNNER_TEMP}/gitversion.XXXXXX")"
          trap 'rm -f "${gitversion_output}"' EXIT
          dotnet-gitversion /output file /outputfile "${gitversion_output}"
          python - <<'PY' "${gitversion_output}" >> "$GITHUB_OUTPUT"
          import json
          import sys
          from pathlib import Path

          output = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8-sig"))
          def get_value(*keys):
              for key in keys:
                  if key not in output:
                      continue
                  value = output[key]
                  if value is None:
                      continue
                  if not isinstance(value, str):
                      raise TypeError(f"GitVersion value '{key}' must be a string, got {type(value).__name__}")
                  value = value.strip()
                  if not value:
                      raise ValueError(f"GitVersion value '{key}' was empty")
                  return value
              raise KeyError(f"Missing GitVersion value. Tried: {', '.join(keys)}")

          # Prefer GitVersion's dedicated NuGet fields first, then fall back to semver fields
          # that are present in newer output schemas.
          print(f"majorMinorPatch={get_value('MajorMinorPatch')}")
          print(f"nuGetVersionV2={get_value('NuGetVersionV2', 'NuGetVersion', 'SemVer', 'FullSemVer')}")
          PY

      - name: Resolve stable package version
        id: version
        shell: bash
        run: |
          echo "PACKAGE_VERSION=${{ steps.gitversion.outputs.majorMinorPatch }}" >> "$GITHUB_ENV"
          echo "package_version=${{ steps.gitversion.outputs.majorMinorPatch }}" >> "$GITHUB_OUTPUT"

      - name: Validate skill channel metadata
        shell: pwsh
        run: |
          $skill = Get-Content ".github/skills/subtitle-extractslator/SKILL.md" -Raw
          if ($skill -notmatch '(?m)^\s*channel:\s*stable\s*$') {
            throw "Stable release requires SKILL.md metadata.channel: stable."
          }

      - name: Restore
        run: dotnet restore SubtitleExtractslator.sln

      - name: Build
        run: dotnet build SubtitleExtractslator.sln -c Release --no-restore

      - name: Test
        run: dotnet test SubtitleExtractslator.sln -c Release --no-build

  package-rid:
    needs: release-stable
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2025
          - rid: win-arm64
            runner: windows-11-arm
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: linux-musl-x64
            runner: ubuntu-24.04
          - rid: linux-musl-arm64
            runner: ubuntu-24.04-arm
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install NativeAOT Linux toolchain
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld zlib1g-dev
          if [[ "${{ matrix.rid }}" == linux-musl-* ]]; then
            sudo apt-get install -y musl-tools
          fi

      - name: Pack RID runtime
        shell: pwsh
        run: >-
          ./scripts/pack-rid-runtime.ps1
          -Rid '${{ matrix.rid }}'
          -PackageVersion '${{ needs.release-stable.outputs.package_version }}'
          -OutputRoot artifacts

      - name: Upload RID package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-${{ matrix.rid }}
          path: artifacts/nuget/${{ matrix.rid }}/*.nupkg
          if-no-files-found: error
          retention-days: 7

  publish-stable:
    needs: [release-stable, package-rid]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download RID packages
        uses: actions/download-artifact@v4
        with:
          pattern: nuget-*
          path: artifacts/nuget
          merge-multiple: true

      - name: Validate release set and create checksums
        shell: pwsh
        run: >-
          ./scripts/prepare-rid-release-set.ps1
          -PackageVersion '${{ needs.release-stable.outputs.package_version }}'

      - name: Push package set to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "${NUGET_API_KEY}" ]; then
            echo "NUGET_API_KEY is not set, skip NuGet push."
            exit 0
          fi
          for package in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$package" --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Remove legacy ZIP and generic package aliases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="nuget-stable-latest"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              case "$asset" in
                *.nupkg|*.nupkg.sha512|subtitle-extractslator-skill.zip)
                  gh release delete-asset "$release_tag" "$asset" --yes
                  ;;
              esac
            done < <(gh release view "$release_tag" --json assets --jq '.assets[].name')
          fi

      - name: Publish stable fallback release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nuget-stable-latest
          name: NuGet Stable Latest
          prerelease: false
          make_latest: true
          files: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.nupkg.sha512
