mode: ContinuousDelivery
# GitVersion is used only to verify branch identity and the development beta label.
# NuGet package numbers come from the shared published-version high-water resolver.
branches:
  main:
    regex: ^main$
    increment: Patch
    label: ''
    is-main-branch: true
  development:
    regex: ^development$
    increment: Patch
    label: beta
    source-branches:
      - main
      - development
ignore:
  sha: []
